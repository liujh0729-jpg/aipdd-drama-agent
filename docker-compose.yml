# DramaClaw CE — 源码构建（默认入口）：api、web、网关全部本地产出。网关已 vendored 进仓（third_party/dramaclaw-gateway，AGPL-3.0，见 third_party/README.md），无需再单独 clone。
#   cp .env.example .env && docker compose up -d --build
# 运行定义（env / 端口 / 卷 / 健康检查）全部 extends 自 docker-compose.release.yml（它现在同样源码构建），这里叠加 build 与本地镜像名。
# 网关源码默认取仓内内置的 ./third_party/dramaclaw-gateway；想改用外部 checkout：.env 设 DRAMACLAW_GATEWAY_SRC=<路径>。
# 本地构建的镜像命名为 aipdd/*。零外部镜像，拉下即用。
services:
  api:
    extends:
      file: docker-compose.release.yml
      service: api
    image: aipdd/api
    build:
      context: .
      dockerfile: Dockerfile
      # 默认精简镜像。要 3DGS/SHARP「world」特性（torch/gsplat/sharp/da2 + SOG 工具）：
      #   INSTALL_WORLD=1 docker compose up -d --build
      # 注：权重运行时下载不入镜像；slim base 为 CPU，GPU 加速需 CUDA base；Mac Docker 无 GPU。
      args:
        INSTALL_WORLD: "${INSTALL_WORLD:-0}"
  localapi:
    extends:
      file: docker-compose.release.yml
      service: localapi
    image: aipdd/gateway
    build:
      context: ${DRAMACLAW_GATEWAY_SRC:-./third_party/dramaclaw-gateway}
      dockerfile: Dockerfile
  web:
    extends:
      file: docker-compose.release.yml
      service: web
    image: aipdd/web
    build:
      context: ./frontend
      dockerfile: Dockerfile
  renderer:
    extends:
      file: docker-compose.release.yml
      service: renderer
    image: aipdd/renderer
    build:
      context: ./services/hyperframes-renderer
      dockerfile: Dockerfile

# extends 不带顶层 volumes，需在此重申（名字与 release 文件一致，数据卷共用）。
volumes:
  ce-data:
  localapi-data:
