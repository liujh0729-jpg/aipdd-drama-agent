# 桌面版独立 nginx 主配置（由 Tauri 运行时用实际路径渲染后写入 app-data/nginx/nginx.conf）。
# 占位符（orchestrator::prepare_nginx_conf 负责替换）：
#   __LISTEN_PORT__   本地监听端口（默认 8080）
#   __BACKEND_PORT__  FastAPI 端口（默认 8780）
#   __WEB_ROOT__      前端 dist 绝对路径
#   __PREFIX__        app-data/nginx 前缀（pid/logs/temp 落此）
#   __RESOURCE_NGINX__ App 内置资源里的 nginx 目录（含 mime.types）
# 反代逻辑与 frontend/docker/nginx.conf.template 保持一致：/api、/gateway/v1、
# /static、org-brand、assets、SPA fallback、CSP、WebSocket 升级、SSE 不缓冲。

pid                 "__PREFIX__/logs/nginx.pid";
error_log           "__PREFIX__/logs/error.log" warn;

events {
    worker_connections 1024;
}

http {
    include             "__RESOURCE_NGINX__/mime.types";
    default_type        application/octet-stream;

    # 临时目录全部落在可写前缀内，避免只读资源目录写入失败。
    client_body_temp_path   "__PREFIX__/client_body";
    proxy_temp_path         "__PREFIX__/temp/proxy";
    fastcgi_temp_path       "__PREFIX__/temp/fastcgi";
    uwsgi_temp_path         "__PREFIX__/temp/uwsgi";
    scgi_temp_path          "__PREFIX__/temp/scgi";

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;
    server_tokens   off;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log  "__PREFIX__/logs/access.log"  main;

    upstream supertale_backend {
        server 127.0.0.1:__BACKEND_PORT__;
        keepalive 32;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      "";
    }

    # 桌面恒为本地 http，X-Forwarded-Proto 为空 → 下列 map 取默认（不加 https 强化头）。
    map $http_x_forwarded_proto $csp_upgrade {
        https   "; upgrade-insecure-requests";
        default "";
    }
    map $http_x_forwarded_proto $hsts_value {
        https   "max-age=63072000; includeSubDomains; preload";
        default "";
    }
    map $http_x_forwarded_proto $forwarded_proto {
        ""      $scheme;
        default $http_x_forwarded_proto;
    }

    server {
        listen __LISTEN_PORT__ default_server;
        server_name _;

        root  "__WEB_ROOT__";
        index index.html;

        client_max_body_size 200m;

        location / {
            try_files $uri $uri/ /index.html;

            add_header Cache-Control "no-cache" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-LvxLzCeWBZ/DC3ejUm4WcZpQNZXYDUz4p/53gA+dzKk='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://novelvideo-assets-chengdu.oss-cn-chengdu.aliyuncs.com https://nfg-web.oss-cn-chengdu.aliyuncs.com; media-src 'self' blob: https://novelvideo-assets-chengdu.oss-cn-chengdu.aliyuncs.com; font-src 'self' data:; connect-src 'self' http://127.0.0.1:__LISTEN_PORT__ ws://127.0.0.1:__LISTEN_PORT__ https://novelvideo-assets-chengdu.oss-cn-chengdu.aliyuncs.com https://api.github.com https://github.com https://objects.githubusercontent.com; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'${csp_upgrade}" always;
            add_header Strict-Transport-Security $hsts_value always;
            add_header X-Frame-Options "DENY" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), clipboard-read=(), clipboard-write=(self), display-capture=(), fullscreen=(self), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), picture-in-picture=(self), usb=(), xr-spatial-tracking=()" always;
            add_header Cross-Origin-Opener-Policy "same-origin" always;
            add_header Cross-Origin-Resource-Policy "same-origin" always;
        }

        location ~ "^/assets/org-brand/([A-Za-z0-9_-]{1,64})/logo$" {
            if ($args != "") { return 404; }
            limit_except GET HEAD { deny all; }
            proxy_pass http://supertale_backend/api/v1/org-brand/$1/logo;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_pass_request_headers off;
            proxy_hide_header Set-Cookie;
            proxy_hide_header Location;

            add_header Strict-Transport-Security $hsts_value always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        }

        location /assets/ {
            try_files $uri =404;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header Strict-Transport-Security $hsts_value always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        }

        location /api/ {
            proxy_pass http://supertale_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;

            proxy_buffering off;
            proxy_cache off;
            proxy_request_buffering off;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;

            add_header Strict-Transport-Security $hsts_value always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        }

        location /gateway/v1/ {
            proxy_pass http://supertale_backend/api/v1/openai/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;

            proxy_buffering off;
            proxy_cache off;
            proxy_request_buffering off;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;

            add_header Strict-Transport-Security $hsts_value always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        }

        location /static/ {
            proxy_pass http://supertale_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_buffering on;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;

            add_header Strict-Transport-Security $hsts_value always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        }

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }
    }
}
