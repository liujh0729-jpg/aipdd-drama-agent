<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AIPDD DramaClaw · 服务状态</title>
  <style>
    /* 运行期诊断窗口（「详细信息」）：服务卡片 + 日志 + 单服务重启。
       启动流程不展示这里——启动卡见 index.html，两者共用 app.js。 */
    :root {
      --bg: #0f1115; --panel: #171a21; --line: #262b36; --fg: #e6e9ef;
      --muted: #9aa4b2; --accent: #4f8cff;
      --ok: #2ecc71; --warn: #f5a623; --err: #ff5c5c; --idle: #566073;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; background: var(--bg); color: var(--fg);
      font: 14px/1.5 -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      display: flex; flex-direction: column;
    }
    header {
      padding: 14px 16px; border-bottom: 1px solid var(--line);
      display: flex; align-items: center; gap: 10px;
    }
    header h1 { font-size: 15px; margin: 0; font-weight: 600; }
    header .ver { color: var(--muted); font-size: 12px; margin-left: auto; }
    .boot {
      margin: 12px 16px; padding: 10px 12px; border: 1px solid var(--line);
      border-radius: 10px; background: var(--panel);
    }
    .boot.hidden { display: none; }
    .boot .msg { font-size: 13px; }
    .boot .bar { height: 6px; border-radius: 3px; background: #222732; overflow: hidden; margin-top: 8px; }
    .boot .bar > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s; }
    .boot.error { border-color: var(--err); }
    .boot.error .msg { color: var(--err); }
    .boot .tips { margin-top: 8px; color: var(--muted); font-size: 12px; white-space: pre-wrap; }
    .services { padding: 4px 16px 8px; display: grid; gap: 8px; }
    .svc {
      border: 1px solid var(--line); border-radius: 10px; background: var(--panel);
      padding: 10px 12px; display: flex; align-items: center; gap: 10px;
    }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--idle); flex: none; }
    .dot[data-s="ready"] { background: var(--ok); }
    .dot[data-s="starting"], .dot[data-s="restarting"] { background: var(--warn); animation: pulse 1s infinite; }
    .dot[data-s="crashed"] { background: var(--err); }
    @keyframes pulse { 50% { opacity: .35; } }
    .svc .name { font-weight: 600; }
    .svc .meta { color: var(--muted); font-size: 12px; }
    .svc .grow { flex: 1; min-width: 0; }
    .badge { font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; }
    button {
      background: #222834; color: var(--fg); border: 1px solid var(--line);
      border-radius: 8px; padding: 5px 10px; cursor: pointer; font-size: 12px;
    }
    button:hover { border-color: var(--accent); }
    button:disabled { opacity: .45; cursor: default; }
    .logwrap { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 0 16px 12px; }
    .loghead { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
    .loghead select { background: #222834; color: var(--fg); border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; }
    .loghead .grow { flex: 1; }
    pre.log {
      flex: 1; min-height: 0; overflow: auto; margin: 0;
      background: #0b0d11; border: 1px solid var(--line); border-radius: 10px;
      padding: 10px 12px; font: 12px/1.45 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      color: #cdd6e2; white-space: pre-wrap; word-break: break-all;
    }
    pre.log .stderr { color: #ffb4b4; }
    pre.log .sys { color: var(--accent); }
    .models { padding: 0 16px 10px; display: grid; gap: 6px; }
    .models.hidden { display: none; }
    .model .m-bar { height: 5px; border-radius: 3px; background: #222732; overflow: hidden; }
    .model .m-bar > i { display: block; height: 100%; width: 0; background: var(--ok); }
    footer { padding: 8px 16px 14px; border-top: 1px solid var(--line); display: flex; gap: 8px; }
    /* 端口健康区：受管端口逐个状态（空闲/运行中/被外部占用）+ 一键释放 + 重启回默认。 */
    .porth { padding: 4px 16px 8px; display: grid; gap: 8px; }
    .porth-head { display: flex; align-items: center; gap: 8px; }
    .porth-head h2 { font-size: 13px; margin: 0; font-weight: 600; }
    .porth-head .grow { flex: 1; }
    .porth-rows { display: grid; gap: 6px; }
    .ph-row {
      border: 1px solid var(--line); border-radius: 10px; background: var(--panel);
      padding: 8px 12px; display: flex; align-items: center; gap: 10px; font-size: 13px;
    }
    .ph-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ph-state { color: var(--muted); font-size: 12px; flex: none; }
    .ph-owner {
      color: var(--err); font-size: 12px; flex: none; max-width: 44%;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .ph-row.free .ph-owner { color: var(--muted); }
    button.warn { border-color: var(--err); color: #ffd7d7; }
    button.primary { background: var(--accent); border-color: var(--accent); color: #06070a; font-weight: 600; }
    .hidden { display: none !important; }
    /* 存储位置：数据根可切到其他磁盘（模型/数据库/成片/日志），安装目录只读展示。 */
    .storage { padding: 4px 16px 8px; display: grid; gap: 8px; }
    .store-rows { display: grid; gap: 6px; }
    .store-row {
      border: 1px solid var(--line); border-radius: 10px; background: var(--panel);
      padding: 8px 12px; display: flex; align-items: center; gap: 10px; font-size: 13px;
    }
    .store-k { color: var(--muted); flex: none; width: 64px; font-size: 12px; }
    .store-v { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .store-hint { color: var(--muted); font-size: 12px; line-height: 1.5; }
    .store-hint.err { color: var(--err); }
    .store-hint.ok { color: var(--ok); }
    .store-confirm {
      border: 1px solid var(--accent); border-radius: 10px; background: #141a26;
      padding: 10px 12px; display: grid; gap: 8px; font-size: 13px;
    }
    .store-confirm .target { color: var(--fg); word-break: break-all; }
    .store-confirm label { display: flex; align-items: flex-start; gap: 8px; color: var(--muted); font-size: 12px; }
    .store-confirm label input { margin-top: 2px; }
    .store-warn { color: var(--warn); font-size: 12px; }
    .store-actions { display: flex; gap: 8px; justify-content: flex-end; }
  </style>
</head>
<body>
  <header>
    <h1>AIPDD DramaClaw 桌面服务</h1>
    <span class="ver" id="ver">v…</span>
  </header>

  <div class="boot hidden" id="boot">
    <div class="msg" id="bootMsg">正在启动本地服务…</div>
    <div class="bar"><i id="bootBar"></i></div>
    <div class="tips" id="bootTips"></div>
  </div>

  <div class="services" id="services"></div>

  <div class="porth" id="porth">
    <div class="porth-head">
      <h2>端口健康</h2>
      <span class="grow"></span>
      <button id="phRefresh">重新检测</button>
      <button id="phRelease" class="warn">释放占用端口</button>
      <button id="phRestart" class="primary">重启回默认</button>
    </div>
    <div class="porth-rows" id="porthRows"></div>
  </div>

  <div class="storage" id="storage">
    <div class="porth-head">
      <h2>存储位置</h2>
      <span class="badge" id="storeBadge">…</span>
      <span class="grow"></span>
      <button id="storeRetry" class="hidden">重新检测</button>
      <button id="storeReset" class="warn hidden">改用默认位置</button>
      <button id="storeChange">更改…</button>
    </div>
    <div class="store-rows">
      <div class="store-row">
        <span class="store-k">数据</span>
        <span class="store-v" id="storePath">…</span>
      </div>
      <div class="store-row">
        <span class="store-k">程序安装</span>
        <span class="store-v" id="installPath">…</span>
      </div>
    </div>
    <div class="store-hint" id="storeHint"></div>
    <div class="store-confirm hidden" id="storeConfirm">
      <div>新位置：<span class="target" id="storeTarget"></span></div>
      <label><input type="checkbox" id="storeMigrate" checked />
        迁移现有数据（模型 / 数据库 / 成片 / 日志；耗时取决于数据量）</label>
      <label><input type="checkbox" id="storeDelete" checked />
        迁移并校验成功后删除旧位置的数据（释放原盘空间）</label>
      <div class="store-warn" id="storeWarn"></div>
      <div class="store-actions">
        <button id="storeCancel">取消</button>
        <button id="storeApply" class="primary">开始迁移并重启</button>
      </div>
    </div>
  </div>

  <div class="models hidden" id="models"></div>

  <div class="logwrap">
    <div class="loghead">
      <label>日志</label>
      <select id="logFilter">
        <option value="*">全部</option>
        <option value="nginx">nginx</option>
        <option value="gateway">gateway</option>
        <option value="vectcut">vectcut</option>
        <option value="api">api</option>
      </select>
      <span class="grow"></span>
      <button id="clearLog">清空</button>
    </div>
    <pre class="log" id="log"></pre>
  </div>

  <footer>
    <button id="openApp" disabled>打开主界面</button>
    <span class="grow"></span>
    <button id="uninstall" class="warn hidden">卸载应用</button>
    <button id="copyLogs">复制日志目录路径</button>
  </footer>

  <script>window.PANEL_VIEW = "console";</script>
  <script src="app.js"></script>
</body>
</html>
