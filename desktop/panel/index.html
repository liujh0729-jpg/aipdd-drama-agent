<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AIPDD DramaClaw</title>
  <style>
    /* 启动卡（Photoshop 式 splash）：无边框、不可缩放，只有品牌 + 版本 + 进度。
       配色取自 DESIGN.md 的暗色 token（background / text / text-muted / primary / accent）。
       日志与服务卡片不在这里——那是 console.html（「详细信息」窗口）的职责。 */
    :root {
      --bg: #0a0c12;
      --text: #e8eaf0;
      --muted: #6f7079;
      --line: #1f2026;
      --primary: #00bdcf;
      --accent: #5ba0ff;
      --warn: #efa831;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: radial-gradient(120% 90% at 18% 0%, #12151d 0%, var(--bg) 62%);
      color: var(--text);
      font: 14px/1.5 -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      display: flex; align-items: center; justify-content: center;
      -webkit-user-select: none; user-select: none; cursor: default;
      overflow: hidden;
    }
    .card {
      width: 100%; height: 100%;
      padding: 40px 44px 28px;
      display: flex; flex-direction: column;
      border: 1px solid var(--line);
      position: relative;
      animation: fade-in .5s ease-out both;
    }
    @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
    .brand { display: flex; align-items: center; gap: 22px; margin-top: 6px; }
    .mark {
      width: 92px; height: 92px; flex: none; border-radius: 20px;
      box-shadow: 0 10px 26px rgba(0, 0, 0, .5);
    }
    .id h1 { margin: 0; font-size: 23px; font-weight: 600; letter-spacing: .2px; }
    .id .ver { margin: 6px 0 0; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .id .tag { margin: 3px 0 0; font-size: 12px; color: var(--muted); }
    .spacer { flex: 1; }
    .status { display: flex; align-items: baseline; gap: 12px; }
    .stage { flex: 1; min-width: 0; font-size: 13px; color: var(--text); opacity: .82;
             white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pct { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .bar { height: 3px; border-radius: 2px; background: var(--line); overflow: hidden; margin-top: 10px; }
    .bar > i {
      display: block; height: 100%; width: 0; border-radius: 2px;
      background: linear-gradient(90deg, var(--primary), var(--accent));
    }
    .legal { margin: 16px 0 0; font-size: 11px; color: var(--muted); }
    .plat { margin: 10px 0 0; font-size: 12px; color: var(--muted); letter-spacing: .2px; }
    .plat b { color: var(--text); font-weight: 500; opacity: .78; }
    .quit {
      position: absolute; top: 10px; right: 12px;
      width: 26px; height: 26px; border: 0; border-radius: 6px;
      background: transparent; color: var(--muted);
      font-size: 15px; line-height: 1; cursor: pointer; opacity: .5;
    }
    .quit:hover { opacity: 1; background: #171922; }
    /* 失败态：进度条与阶段文字转琥珀色，露出「重试启动 / 查看详细信息」；
       百分比此时无意义，收掉。 */
    .card[data-s="error"] .bar > i { background: var(--warn); }
    .card[data-s="error"] .stage { color: var(--warn); opacity: 1; }
    .card[data-s="error"] .pct { visibility: hidden; }
    .actions {
      display: none; align-items: center; gap: 10px; margin-top: 14px;
    }
    .card[data-s="error"] .actions { display: flex; }
    .detail {
      background: transparent; border: 1px solid var(--line); border-radius: 7px;
      color: var(--text); font-size: 12px; padding: 6px 12px; cursor: pointer;
    }
    .detail:hover { border-color: var(--accent); }
    .retry {
      background: var(--primary); border: 0; border-radius: 7px;
      color: #04171a; font-size: 12px; font-weight: 600; padding: 7px 15px; cursor: pointer;
    }
    .retry:hover { filter: brightness(1.08); }
    .retry:disabled { opacity: .55; cursor: default; filter: none; }
    /* 就绪：百分比补到 100% 后原地停留约 0.35s（文字改成「正在进入主界面…」），
       由前端通知壳再开主窗口并关掉本卡——先开主窗口会把跑满的那一帧盖掉。 */
    .card[data-s="ready"] .bar > i { background: var(--primary); }
  </style>
</head>
<body>
  <main class="card" id="card" data-s="booting" data-tauri-drag-region>
    <button class="quit" id="quit" title="退出 AIPDD DramaClaw">×</button>

    <div class="brand" data-tauri-drag-region>
      <img class="mark" src="logo.png" alt="AIPDD" data-tauri-drag-region />
      <div class="id" data-tauri-drag-region>
        <h1>AIPDD DramaClaw</h1>
        <p class="ver" id="ver">Version …</p>
        <p class="tag">本地部署的 AI 短剧创作台</p>
      </div>
    </div>

    <div class="spacer"></div>

    <div class="status">
      <span class="stage" id="stage">正在准备…</span>
      <span class="pct" id="pct">0%</span>
    </div>
    <div class="bar"><i id="bar"></i></div>

    <div class="actions">
      <button class="retry" id="retry">重试启动</button>
      <button class="detail" id="detail">查看详细信息</button>
    </div>
    <p class="plat" data-tauri-drag-region>AIPDD算力平台：<b>www.aipdd.work</b></p>
    <p class="legal">© 2026 AIPDD. 保留所有权利。</p>
  </main>

  <script>window.PANEL_VIEW = "splash";</script>
  <script src="app.js"></script>
</body>
</html>
