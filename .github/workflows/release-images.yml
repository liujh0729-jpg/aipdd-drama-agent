name: release-images

# 发布/手动触发时，从源码构建三服务多架构镜像并推送到 GHCR（ghcr.io）。
# 用内置 GITHUB_TOKEN 登录，无需配置任何仓库 Secret。镜像默认私有，
# 需匿名 pull 时把包置为 public（镜像推送成功后由维护者用包设置或 API 处理）。
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "要构建的 release tag(如 v2.1.6)"
        required: true
        type: string
      push_latest:
        description: "同时更新 latest tag(重建旧版本时保持关闭)"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  REGISTRY: ghcr.io
  IMAGE_NS: ${{ github.repository_owner }}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - svc: api
            context: .
            dockerfile: Dockerfile
          - svc: gateway
            context: third_party/dramaclaw-gateway
            dockerfile: Dockerfile
          - svc: web
            context: frontend
            dockerfile: Dockerfile
          - svc: vectcut
            context: services/vectcut
            dockerfile: Dockerfile
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NS }}/dramaclaw-${{ matrix.svc }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.RELEASE_TAG }}
          flavor: |
            latest=${{ github.event_name == 'release' && 'auto' || (inputs.push_latest && 'true' || 'false') }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_APP_VERSION=${{ env.RELEASE_TAG }}
